<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      #canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 20px solid blue;
        box-sizing: border-box;
      }

      #controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      #joystick {
        position: absolute;
        left: 30px;
        bottom: 30px;

        width: 150px;
        height: 150px;

        border-radius: 50%;
        background: rgba(100, 100, 100, 0.4);

        pointer-events: auto;
        touch-action: none;
      }

      #joystick-knob {
        position: absolute;

        width: 70px;
        height: 70px;

        left: 40px;
        top: 40px;

        border-radius: 50%;
        background: rgba(50, 50, 50, 0.8);

        pointer-events: none;

        transition: transform 0.05s linear;
      }

      #buttons {
        position: absolute;
        right: 30px;
        bottom: 40px;

        width: 160px;
        height: 100px;

        pointer-events: auto;
      }

      #buttons button {
        position: absolute;

        width: 65px;
        height: 65px;

        border: none;
        border-radius: 50%;

        background: #444;
        color: white;

        font-size: 20px;
        font-weight: bold;

        touch-action: none;
      }

      #button-b {
        left: 0;
        top: 30px;
      }

      #button-a {
        right: 0;
        top: 0;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <div id="controls">
      <div id="joystick">
        <div id="joystick-knob"></div>
      </div>

      <div id="buttons">
        <button id="button-b">B</button>
        <button id="button-a">A</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
